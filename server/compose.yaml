services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: avtoschool
      POSTGRES_USER: avtoschool
      POSTGRES_PASSWORD: avtoschool_demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - school_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtoschool -d avtoschool"]
      interval: 2s
      timeout: 4s
      retries: 15
volumes:
  school_data:
